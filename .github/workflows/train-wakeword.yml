name: Train Shivangi wake word

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Positive clips from the English multi-speaker voice (more = better, slower)"
        default: "2400"
      epochs:
        description: "Training rounds"
        default: "40"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SAMPLES: ${{ github.event.inputs.samples }}
      EPOCHS: ${{ github.event.inputs.epochs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "piper-tts==1.2.0" onnxruntime onnx soundfile scipy numpy

      - name: Download voices
        run: |
          mkdir -p voices
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main
          # English voice with ~900 different speakers
          wget -q -O voices/en_libritts.onnx $HF/en/en_US/libritts_r/medium/en_US-libritts_r-medium.onnx
          wget -q -O voices/en_libritts.onnx.json $HF/en/en_US/libritts_r/medium/en_US-libritts_r-medium.onnx.json
          # Hindi voices (skipped if a name is not available)
          for v in pratham priyamvada rohan; do
            wget -q -O voices/hi_$v.onnx $HF/hi/hi_IN/$v/medium/hi_IN-$v-medium.onnx \
              && wget -q -O voices/hi_$v.onnx.json $HF/hi/hi_IN/$v/medium/hi_IN-$v-medium.onnx.json \
              || rm -f voices/hi_$v.onnx*
          done
          ls -la voices

      - name: Quick test (fails early if voices do not work)
        run: |
          python generate.py --model voices/en_libritts.onnx --texts "Shivangi" --out data/test --count 3
          test "$(ls data/test/*.wav | wc -l)" -ge 3

      - name: Generate "Shivangi" (English voices)
        run: |
          python generate.py --model voices/en_libritts.onnx \
            --texts "Shivangi|Shivangi!|Shivangi?|Shivaangee|Shi vaan gee|Hey Shivangi" \
            --out data/positive/en --count "$SAMPLES"

      - name: Generate "शिवांगी" (Hindi voices)
        run: |
          for m in voices/hi_*.onnx; do
            [ -f "$m" ] || continue
            python generate.py --model "$m" --texts "शिवांगी|शिवांगी!|शिवांगी?|हे शिवांगी" \
              --out "data/positive/$(basename "$m" .onnx)" --count 150 || echo "skipped $m"
          done

      - name: Generate similar words (must NOT wake her)
        run: |
          python generate.py --model voices/en_libritts.onnx --texts-file adversarial_en.txt \
            --out data/adversarial/en --count 520
          for m in voices/hi_*.onnx; do
            [ -f "$m" ] || continue
            python generate.py --model "$m" --texts-file adversarial_hi.txt \
              --out "data/adversarial/$(basename "$m" .onnx)" --count 72 || echo "skipped $m"
          done

      - name: Generate everyday speech (must NOT wake her)
        run: |
          python generate.py --model voices/en_libritts.onnx --texts-file phrases_en.txt \
            --out data/negative/en --count 800
          for m in voices/hi_*.onnx; do
            [ -f "$m" ] || continue
            python generate.py --model "$m" --texts-file phrases_hi.txt \
              --out "data/negative/$(basename "$m" .onnx)" --count 270 || echo "skipped $m"
          done

      - name: Count clips
        run: |
          for d in positive adversarial negative; do
            echo "$d: $(find data/$d -name '*.wav' | wc -l)"
          done

      - name: Train
        run: |
          python train.py --pos data/positive --adv data/adversarial --neg data/negative \
            --out output --epochs "$EPOCHS"
          cat output/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: shivangi-wakeword
          path: output/
